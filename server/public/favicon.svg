<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Steam gradients matching SteamPotIcon -->
    <linearGradient id="steamGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="steamGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Steam curls floating above -->
  <line x1="20" y1="3" x2="20" y2="11" stroke="url(#steamGrad1)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="24" y1="1" x2="24" y2="12" stroke="url(#steamGrad2)" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="28" y1="3" x2="28" y2="11" stroke="url(#steamGrad1)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Pot handles -->
  <path d="M6 22C4 22 2.5 24 2.5 26.5C2.5 29 4 31 6 31" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M42 22C44 22 45.5 24 45.5 26.5C45.5 29 44 31 42 31" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Pot Lid Handle Knob -->
  <ellipse cx="24" cy="12" rx="3.5" ry="2" fill="#c2410c" stroke="#7c2d12" stroke-width="1.5"/>
  
  <!-- Pot Lid -->
  <path d="M8 18C12 15 20 14 24 14C28 14 36 15 40 18" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Pot Body (Traditional Asanka / Heavy cooking cauldron) -->
  <path d="M8 19H40V28C40 36 33 42 24 42C15 42 8 36 8 28V19Z" fill="#fff7ed" stroke="#c2410c" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Terracotta Pot Accent Ring -->
  <path d="M8 24C12 26 20 27 24 27C28 27 36 26 40 24" stroke="#ea580c" stroke-width="1.75" stroke-linecap="round" stroke-dasharray="2 3"/>

  <!-- Warm Ember Core -->
  <circle cx="24" cy="33" r="3.5" fill="#ea580c" opacity="0.85"/>
</svg>
